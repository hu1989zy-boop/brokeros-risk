spring:
  datasource:
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      initialization-fail-timeout: 1
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.brokeros.risk: INFO
