name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Engineering foundation verification
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java 21
        # actions/setup-java v5.6.0
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Set up kubectl
        # Azure/setup-kubectl v5.1.0
        uses: Azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d
        with:
          version: v1.36.3

      - name: Static validation
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: sh scripts/verify-static.sh "$BASE_SHA"

      - name: Maven tests
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress test

      - name: Maven package
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress package

      - name: Kubernetes Kustomize render
        run: sh scripts/verify-kustomize.sh

      - name: Docker and infrastructure verification
        run: sh scripts/verify-infrastructure.sh
