apiVersion: v1
kind: ConfigMap
metadata:
  name: brokeros-risk-config
  labels:
    app.kubernetes.io/name: brokeros-risk
    app.kubernetes.io/component: backend
data:
  SERVER_PORT: "8080"
  DB_URL: jdbc:mysql://mysql:3306/brokeros_risk?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
  DB_USERNAME: brokeros
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
