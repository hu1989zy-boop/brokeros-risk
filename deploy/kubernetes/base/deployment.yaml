apiVersion: apps/v1
kind: Deployment
metadata:
  name: brokeros-risk-backend
  labels:
    app.kubernetes.io/name: brokeros-risk
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: brokeros-risk
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: brokeros-risk
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: brokeros-risk-backend
          image: brokeros-risk-backend:0.1.0-SNAPSHOT
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: brokeros-risk-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: brokeros-risk-secrets
                  key: db-password
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
